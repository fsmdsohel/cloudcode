version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cloudcode_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudcode_network

  redis:
    image: redis:alpine
    container_name: cloudcode_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudcode_network

volumes:
  postgres_data:
  redis_data:

networks:
  cloudcode_network:
    driver: bridge
